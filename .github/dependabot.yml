version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft-servicing:
        patterns: ["Microsoft.EntityFrameworkCore*", "Microsoft.AspNetCore*", "Microsoft.Extensions*", "Microsoft.Data.Sqlite"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
